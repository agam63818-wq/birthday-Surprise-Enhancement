kind = "web"
previewPath = "/"
title = "Birthday Surprise"
version = "1.0.0"
id = "artifacts/birthday-surprise"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25201
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/birthday-surprise run dev"

[services.env]
PORT = "25201"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/birthday-surprise", "run", "build"]
publicDir = "artifacts/birthday-surprise/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
