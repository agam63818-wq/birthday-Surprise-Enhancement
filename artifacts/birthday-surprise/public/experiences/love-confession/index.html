<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="style.css">
</head>
<body id="confession-root" data-experience="love-confession" class="overflow-hidden flex items-center justify-center relative selection:bg-pink-500 selection:text-white">
  <div class="absolute inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
    <div class="absolute top-[-20%] left-[-20%] w-[600px] h-[600px] bg-pink-500/10 rounded-full blur-[130px]"></div>
    <div class="absolute bottom-[-20%] right-[-20%] w-[600px] h-[600px] bg-purple-500/10 rounded-full blur-[130px]"></div>
    <div id="particles" class="absolute inset-0"></div>
  </div>
  <canvas id="c" class="absolute inset-0 w-full h-full z-10 pointer-events-none hidden-state" aria-hidden="true"></canvas>
  <main id="question-screen" class="z-20 relative flex flex-col items-center text-center max-w-md">
    <div id="cute-heart" class="text-7xl mb-6 filter drop-shadow-[0_0_15px_rgba(255,45,85,0.6)]" aria-hidden="true">🥺</div>
    <h1 id="question-text" class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-8 bg-gradient-to-r from-pink-400 via-rose-400 to-purple-400 bg-clip-text text-transparent"></h1>
    <div class="flex items-center justify-center w-full min-h-[60px] answer-row">
      <button id="yesBtn" type="button" class="py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 rounded-full font-semibold text-lg shadow-[0_10px_25px_rgba(255,45,85,0.4)] hover:scale-105 active:scale-95 transition-all border border-pink-400/20"></button>
      <button id="noBtn" type="button" class="py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full font-semibold text-lg text-white/80 transition-all"></button>
    </div>
    <p id="no-reaction" class="no-reaction" role="status" aria-live="polite" hidden></p>
  </main>
  <section id="climax-screen" class="absolute inset-0 z-20 flex flex-col items-center justify-center hidden-state" aria-label="Love confession reveal" aria-hidden="true" inert>
    <div id="love-bg-text" class="absolute text-center select-none z-0 transform scale-75 opacity-0">
      <h2 id="climax-line-1" class="text-6xl sm:text-8xl font-black uppercase tracking-wider bg-gradient-to-r from-pink-500 via-rose-500 to-purple-500 bg-clip-text text-transparent"></h2>
      <h2 id="climax-line-2" class="text-4xl sm:text-5xl font-serif text-pink-300 mt-2"></h2>
    </div>
    <button id="envelope-trigger" type="button" class="absolute bottom-24 flex flex-col items-center gap-3 cursor-pointer z-30 transform scale-0 group" aria-label="Open secret letter">
      <span class="envelope-icon relative w-20 h-12 bg-gradient-to-br from-pink-400 to-rose-500 rounded-lg shadow-[0_10px_20px_rgba(255,45,85,0.3)] transition-transform duration-300 group-hover:scale-110 group-hover:-translate-y-1">
        <span class="absolute top-0 left-0 w-full h-0 border-l-[40px] border-l-transparent border-r-[40px] border-r-transparent border-t-[24px] border-t-pink-300 z-20 origin-top transition-transform duration-500 group-hover:rotateX-180"></span>
        <span class="absolute top-[35%] left-1/2 -translate-x-1/2 -translate-y-1/2 text-white text-xs z-30 drop-shadow-md animate-pulse" aria-hidden="true">❤️</span>
      </span>
      <span id="envelope-label" class="text-xs uppercase tracking-[0.2em] text-pink-300 font-bold animate-pulse"></span>
    </button>
  </section>
  <div id="final-actions" class="final-actions hidden-state" aria-hidden="true" inert>
    <button id="continueBtn" type="button" class="final-primary"></button>
    <button id="replayBtn" type="button" class="final-secondary"></button>
  </div>
  <div id="letter-overlay" class="absolute inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center hidden-state" role="dialog" aria-modal="true" aria-labelledby="letter-title" aria-hidden="true" inert>
    <div id="letter-box" class="bg-white text-gray-900 rounded-3xl p-6 sm:p-8 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.5)] border border-pink-100 flex flex-col relative transform translate-y-32 scale-95" tabindex="-1">
      <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center text-white text-base border-2 border-white shadow-md" aria-hidden="true">❤️</div>
      <h3 id="letter-title" class="text-3xl font-serif text-rose-600 mb-4 text-center border-b border-rose-100 pb-2"></h3>
      <div id="letter-text" class="space-y-3 font-sans text-sm sm:text-base text-gray-700 leading-relaxed min-h-[120px]"></div>
      <div id="letter-signature" class="mt-6 text-right border-t border-rose-100 pt-4 opacity-0 transform translate-y-4">
        <span id="signature-lead" class="text-xs text-gray-400 block"></span>
        <span id="signature-name" class="text-3xl font-serif text-rose-600 block mt-1"></span>
      </div>
      <button id="closeBtn" type="button" class="mt-6 px-6 py-2.5 bg-rose-50 hover:bg-rose-100 border border-rose-100 rounded-full text-rose-600 font-semibold text-sm transition-all hover:scale-105 w-full"></button>
    </div>
  </div>
  <div id="experience-fallback" class="experience-fallback" role="alert" hidden><p>This confession could not finish loading. You can still continue.</p><button id="fallback-continue" type="button" class="final-primary">Continue</button></div>
  <canvas id="confetti-canvas" class="absolute inset-0 pointer-events-none z-40" aria-hidden="true"></canvas>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/confetti.browser.js"></script>
  <script src="../shared/bridge.js"></script>
  <script src="script.js"></script>
</body>
</html>
